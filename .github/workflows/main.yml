name: Build and Package Linux Deb

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build .deb Package
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Compile and Package Debian .deb
        run: |
          PKG="gsuite-offline_1.0.0_amd64"
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/opt/gsuite-offline"
          cp -r dist/* "$PKG/opt/gsuite-offline/"

          cat << 'EOF' > "$PKG/DEBIAN/control"
          Package: gsuite-offline
          Version: 1.0.0
          Section: office
          Priority: optional
          Architecture: amd64
          Depends: libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37, libgtk-3-0, libc6
          Maintainer: Offline Suite Project <md.ibrahim.kh217@gmail.com>
          Description: Ultra-lightweight native Linux Google Docs, Sheets, and Slides suite
           Runs natively using system WebKitGTK and GTK3 libraries with under 60MB RAM.
          EOF

          cat << 'EOF' > "$PKG/usr/share/applications/gsuite-offline.desktop"
          [Desktop Entry]
          Name=Google Workspace Offline Suite
          Comment=Ultra-fast offline Docs, Sheets and Slides
          Exec=gsuite-offline %U
          Icon=gsuite-offline
          Terminal=false
          Type=Application
          Categories=Office;WordProcessor;Spreadsheet;Presentation;
          EOF

          cat << 'EOF' > "$PKG/usr/bin/gsuite-offline"
          #!/usr/bin/env python3
          import sys, os, time, socket, threading
          from http.server import HTTPServer, SimpleHTTPRequestHandler

          # Pick a free loopback port
          sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          sock.bind(('127.0.0.1', 0))
          port = sock.getsockname()[1]
          sock.close()

          # Start ultra-lightweight local offline HTTP server in background thread
          os.chdir('/opt/gsuite-offline')
          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass

          httpd = HTTPServer(('127.0.0.1', port), QuietHandler)
          t = threading.Thread(target=httpd.serve_forever, daemon=True)
          t.start()
          time.sleep(0.05)

          url = f'http://127.0.0.1:{port}/index.html'

          try:
              import gi
              gi.require_version('Gtk', '3.0')
              try:
                  gi.require_version('WebKit2', '4.1')
              except:
                  gi.require_version('WebKit2', '4.0')
              from gi.repository import Gtk, WebKit2
              win = Gtk.Window(title='Google Workspace Offline Suite')
              win.set_default_size(1280, 800)
              win.set_position(Gtk.WindowPosition.CENTER)
              view = WebKit2.WebView()
              settings = view.get_settings()
              settings.set_enable_javascript(True)
              settings.set_enable_offline_web_application_cache(True)
              view.load_uri(url)
              win.add(view)
              win.connect('destroy', Gtk.main_quit)
              win.show_all()
              Gtk.main()
          except Exception:
              os.system(f'x-www-browser --app="{url}" || sensible-browser "{url}" || xdg-open "{url}"')
          EOF
          chmod +x "$PKG/usr/bin/gsuite-offline"

          dpkg-deb --build --root-owner-group "$PKG"

      - name: Verify .deb File Was Created
        run: |
          ls -lh gsuite-offline_1.0.0_amd64.deb

      - name: Upload .deb as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gsuite-offline_1.0.0_amd64
          path: gsuite-offline_1.0.0_amd64.deb
          retention-days: 30
